
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUM-AI.V3.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#c0c0c0;font-family:monospace;color:#000}
.windows-box{background:#ece9d8;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #808080;border-bottom:2px solid #808080;box-shadow:2px 2px 0 #000}
.windows-button{background:#ece9d8;border-top:2px solid #fff;border-left:2px solid #fff;border-right:2px solid #404040;border-bottom:2px solid #404040;font-family:monospace;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.windows-button:active{border-top:2px solid #404040;border-left:2px solid #404040;border-right:2px solid #fff;border-bottom:2px solid #fff;padding-top:3px;padding-left:3px}
.windows-input{background:#fff;border-top:2px solid #808080;border-left:2px solid #808080;border-right:2px solid #fff;border-bottom:2px solid #fff;font-family:monospace}
</style>
</head>
<body class="p-4 min-h-screen flex flex-col">
<header class="windows-box p-2 mb-4 bg-blue-900 text-white text-sm">
<div class="flex flex-wrap justify-between items-center gap-2">
<span class="font-bold">TUM-AI学習 [V3.0]</span>
<nav class="flex flex-wrap items-center gap-2">
<button onclick="startNewChat()" class="windows-button px-3 py-1 text-black text-xs bg-green-100">＋ 新しいチャット</button>
<div class="relative">
<button onclick="toggleHistoryMenu()" class="windows-button px-3 py-1 text-black text-xs">チャット履歴 ▼</button>
<div id="history-menu" class="hidden absolute right-0 top-full mt-1 w-72 max-h-80 overflow-y-auto bg-white text-black border-2 border-gray-600 shadow-lg z-50 p-2 space-y-1"></div>
</div>
<a href="https://teumadesu.github.io/homepage/" target="_blank" rel="noopener" class="windows-button px-3 py-1 text-black text-xs">ホームページ</a>
<a href="kiyaku,porisi-.html" class="windows-button px-3 py-1 text-black text-xs">利用規約</a>
<button onclick="openExportModal()" class="windows-button px-3 py-1 text-black text-xs">学習データ管理</button>
</nav>
</div>
</header>

<main class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-4 max-w-7xl mx-auto w-full">
<section class="md:col-span-4 windows-box p-4 flex flex-col space-y-4 text-xs">
<h2 class="bg-blue-800 text-white p-1 font-bold">■ AIの設定 ＆ 知識・学習管理</h2>
<div class="border border-gray-400 p-3 space-y-2 bg-gray-100">
<div class="font-bold text-blue-900">[1] AIの基本プロフィール</div>
<div><label class="block">AIの名前:</label><input type="text" id="ai-name" autocomplete="off" class="windows-input w-full p-1 text-xs" value="AIアシスタント"></div>
<div><label class="block">AIのアバター（アイコン絵文字）:</label><input type="text" id="ai-avatar" autocomplete="off" class="windows-input w-16 p-1 text-xs text-center" value="🔷"></div>
<div><label class="block">知らない質問をされた時のデフォルト返事:</label><input type="text" id="ai-fallback" autocomplete="off" class="windows-input w-full p-1 text-xs" value="すみません、その知識データはありません。教えていただけると嬉しいです。"></div>
<button onclick="applyProfileSettings()" class="windows-button px-3 py-1 bg-gray-200 text-black w-full">設定を反映する</button>
</div>
<div class="border border-gray-400 p-3 space-y-2 bg-gray-100">
<div class="font-bold text-emerald-900">[2] 新しい知識を教える (現在:<span id="qa-count">0</span>件)</div>
<div><label class="block">質問・キーワード:</label><input type="text" id="qa-question" autocomplete="off" class="windows-input w-full p-1 text-xs" placeholder="例: ねむい、おなかすいた"></div>
<div><label class="block">AIの答え:</label><textarea id="qa-answer" rows="2" autocomplete="off" class="windows-input w-full p-1 text-xs" placeholder="例: 寝ましょう！！"></textarea></div>
<button onclick="addQaItem()" class="windows-button px-3 py-1 bg-green-200 text-black w-full font-bold">知識をメモリに書き込む</button>
</div>
<div class="flex-1 border border-gray-400 p-2 bg-white overflow-y-auto max-h-64 space-y-1" id="qa-list"></div>
</section>

<section class="md:col-span-8 windows-box p-4 flex flex-col space-y-3 text-xs">
<h2 class="bg-blue-800 text-white p-1 font-bold flex items-center justify-between">
<span id="current-chat-title">■ AI-チャットルーム</span>
<span id="chat-status-name" class="text-yellow-300">TUM-AI稼働中</span>
</h2>
<div id="chat-messages" class="flex-1 windows-input p-3 overflow-y-auto space-y-3 bg-white min-h-[350px] max-h-[65vh]"></div>
<form id="chat-form" class="flex gap-2">
<input type="text" id="chat-input" autocomplete="off" class="windows-input flex-1 p-2 text-xs" placeholder="ここに質問を入力...">
<button type="submit" class="windows-button px-3 py-2 bg-blue-200 text-black">送信</button>
</form>
</section>
</main>

<div id="export-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
<div class="windows-box p-4 max-w-md w-full bg-[#ece9d8] space-y-3 text-xs">
<div class="bg-blue-800 text-white p-1 font-bold flex justify-between">
<span>AI学習データファイル管理</span>
<button onclick="closeExportModal()" class="text-white font-bold px-1">×</button>
</div>
<div><label class="block mb-1">出力ファイル名:</label><input type="text" id="export-filename" autocomplete="off" class="windows-input w-full p-1" value="my_ai_data"></div>
<button onclick="exportJsonFile()" class="windows-button w-full p-2 bg-blue-100">学習データをJSONファイルとして出力する</button>
<hr class="border-gray-400">
<label class="windows-button w-full p-2 block text-center bg-green-100 cursor-pointer">
保存したAIファイルから読み込む
<input type="file" id="import-file-input" accept=".json" onchange="importJsonFile(event)" class="hidden">
</label>
</div>
</div>

<script>
const DEFAULT_QA=[
{id:"1",question:"こんにちは",answer:"こんにちは！システムは正常に稼働しています。"},
{id:"2",question:"自己紹介して",answer:"私はAIアシスタントです。いろいろ質問して知識を教えてくださいね。"}
];
const STORAGE_KEY="ai_studio_data_v3";
let appState={
config:{name:"AIアシスタント",avatar:"🔷",fallback:"すみません、その知識データはありません。教えていただけると嬉しいです。"},
qaList:DEFAULT_QA.map(item=>({...item})),
sessions:[]
};
let currentSessionId=null;

window.addEventListener("DOMContentLoaded",function(){
const chatForm=document.getElementById("chat-form");
chatForm.addEventListener("submit",handleChatSubmit);
loadLocalState();
if(!Array.isArray(appState.qaList)||appState.qaList.length===0)appState.qaList=DEFAULT_QA.map(item=>({...item}));
if(!Array.isArray(appState.sessions))appState.sessions=[];
appState.sessions=appState.sessions.filter(s=>s&&s.id&&Array.isArray(s.messages));
if(appState.sessions.length===0)createSession();
else currentSessionId=appState.sessions[0].id;
renderAll();
saveLocalState();
});

function loadLocalState(){
try{
const saved=localStorage.getItem(STORAGE_KEY);
if(!saved)return;
const parsed=JSON.parse(saved);
if(parsed&&parsed.config&&Array.isArray(parsed.qaList)){
appState.config={...appState.config,...parsed.config};
appState.qaList=parsed.qaList;
appState.sessions=Array.isArray(parsed.sessions)?parsed.sessions:[];
}
}catch(error){console.error("保存データの読み込みに失敗:",error);}
}

function saveLocalState(){
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appState));}
catch(error){console.error("保存に失敗:",error);alert("データを保存できなかった。ブラウザの保存容量や設定を確認してね。");}
}

function renderAll(){
document.getElementById("ai-name").value=appState.config.name||"AIアシスタント";
document.getElementById("ai-avatar").value=appState.config.avatar||"🔷";
document.getElementById("ai-fallback").value=appState.config.fallback||"";
document.getElementById("chat-status-name").textContent=(appState.config.name||"TUM-AI")+"稼働中";
renderQaList();
renderHistoryMenu();
renderCurrentChat();
}

function renderQaList(){
const container=document.getElementById("qa-list");
document.getElementById("qa-count").textContent=appState.qaList.length;
if(appState.qaList.length===0){
container.innerHTML='<div class="text-gray-500 text-center py-2">知識データはありません</div>';
return;
}
container.innerHTML=appState.qaList.map(item=>`
<div class="border border-gray-300 p-1.5 bg-gray-50 flex justify-between items-center gap-2">
<div class="overflow-hidden pr-2 min-w-0">
<b class="text-blue-800">Q: ${escapeHtml(item.question)}</b><br>
<span class="text-gray-700">A: ${escapeHtml(item.answer)}</span>
</div>
<button onclick="deleteQa('${escapeHtml(item.id)}')" class="windows-button px-1.5 py-0.5 bg-red-100 text-red-700 text-[10px] shrink-0">削除</button>
</div>`).join("");
}

function createSession(){
const session={
id:"session_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
title:"新しいチャット ("+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+")",
messages:[]
};
appState.sessions.unshift(session);
appState.sessions=appState.sessions.slice(0,10);
currentSessionId=session.id;
saveLocalState();
return session;
}

function startNewChat(){
createSession();
renderAll();
document.getElementById("chat-input").focus();
}

function selectSession(id){
if(!appState.sessions.some(s=>s.id===id))return;
currentSessionId=id;
saveLocalState();
renderHistoryMenu();
renderCurrentChat();
document.getElementById("history-menu").classList.add("hidden");
}

function toggleHistoryMenu(){
const menu=document.getElementById("history-menu");
renderHistoryMenu();
menu.classList.toggle("hidden");
}

function renderHistoryMenu(){
const container=document.getElementById("history-menu");
if(!appState.sessions.length){
container.innerHTML='<div class="text-gray-500 text-center py-2">履歴はありません</div>';
return;
}
container.innerHTML=appState.sessions.map(s=>{
const active=s.id===currentSessionId?"bg-blue-100 border-blue-500 font-bold":"bg-gray-50 border-gray-300";
return `<div class="p-2 border ${active} flex justify-between items-center gap-2 text-xs">
<button onclick="selectSession('${escapeHtml(s.id)}')" class="text-left flex-1 min-w-0 truncate">${escapeHtml(s.title)}</button>
<button onclick="deleteSession('${escapeHtml(s.id)}')" class="text-red-600 font-bold px-1 shrink-0">×</button>
</div>`;
}).join("");
}

function deleteSession(id){
appState.sessions=appState.sessions.filter(s=>s.id!==id);
if(currentSessionId===id){
if(appState.sessions.length)currentSessionId=appState.sessions[0].id;
else createSession();
}
saveLocalState();
renderHistoryMenu();
renderCurrentChat();
}

function getCurrentSession(){
return appState.sessions.find(s=>s.id===currentSessionId)||null;
}

function renderCurrentChat(){
const session=getCurrentSession();
const container=document.getElementById("chat-messages");
if(!session)return;
document.getElementById("current-chat-title").textContent="■ "+session.title;
if(!session.messages.length){
container.innerHTML=`<div class="p-2 bg-gray-100 border border-gray-300 rounded"><b>${escapeHtml(appState.config.avatar)} ${escapeHtml(appState.config.name)}:</b> 起動完了しました。何か質問してください！</div>`;
return;
}
container.innerHTML=session.messages.map((msg,index)=>{
if(msg.sender==="user")return `<div class="p-2 bg-blue-50 border border-blue-200 text-right"><b>👤 あなた:</b> ${escapeHtml(msg.text)}</div>`;
const teach=msg.isUnknown?`<div class="mt-1 pt-1 border-t border-gray-300 text-[11px] text-red-600 flex justify-between items-center"><span>▼この質問の答えを知りませんか？▼</span><button onclick="teachFromMessage(${index})" class="windows-button px-2 py-0.5 bg-yellow-200 text-black">今すぐ教える</button></div>`:"";
return `<div class="p-2 bg-gray-100 border border-gray-300"><b>${escapeHtml(appState.config.avatar)} ${escapeHtml(msg.name||appState.config.name)}:</b> ${escapeHtml(msg.text)} ${teach}</div>`;
}).join("");
container.scrollTop=container.scrollHeight;
}

function handleChatSubmit(event){
event.preventDefault();
const input=document.getElementById("chat-input");
const messageText=input.value.trim();
if(!messageText)return;
let session=getCurrentSession();
if(!session)session=createSession();
if(session.messages.length===0)session.title=messageText.length>12?messageText.slice(0,12)+"...":messageText;
session.messages.push({sender:"user",text:messageText});
input.value="";
saveLocalState();
renderCurrentChat();
renderHistoryMenu();
const targetSessionId=session.id;
window.setTimeout(()=>{
const targetSession=appState.sessions.find(s=>s.id===targetSessionId);
if(!targetSession)return;
const result=thinkAiResponse(messageText);
targetSession.messages.push({sender:"ai",name:appState.config.name,text:result.answer,isUnknown:result.isUnknown,unknownQ:messageText});
saveLocalState();
if(currentSessionId===targetSessionId)renderCurrentChat();
renderHistoryMenu();
},250);
}

function normalizeText(value){
return String(value||"").normalize("NFKC").toLowerCase()
.replace(/お腹/g,"おなか")
.replace(/[！!？?。、,.・「」『』（）()\s　]/g,"");
}

function getSearchTerms(value){
const text=normalizeText(value);
const terms=new Set();
if(window.Intl&&Intl.Segmenter){
const segmenter=new Intl.Segmenter("ja",{granularity:"word"});
for(const part of segmenter.segment(text)){
if(part.isWordLike&&part.segment.length>=2)terms.add(part.segment);
}
}
for(let n=2;n<=3;n++){
for(let i=0;i<=text.length-n;i++)terms.add(text.slice(i,i+n));
}
const synonymGroups=[
["こんにちは","やあ","おはよう","こんばんは","挨拶"],
["ありがとう","感謝","サンキュー","助かった"],
["疲れた","つかれた","しんどい","だるい","疲労"],
["眠い","ねむい","眠たい","睡眠"],
["お腹すいた","おなかすいた","空腹","腹減った","はらへった"],
["悲しい","かなしい","落ち込む","つらい","寂しい"],
["嬉しい","うれしい","楽しい","喜び"],
["さようなら","またね","バイバイ","じゃあね"]
];
for(let groupIndex=0;groupIndex<synonymGroups.length;groupIndex++){
const group=synonymGroups[groupIndex];
if(group.some(word=>text.includes(normalizeText(word))))terms.add("同義:"+groupIndex);
}
return terms;
}

function similarityScore(query,candidate){
const q=normalizeText(query);
const c=normalizeText(candidate);
if(!q||!c)return 0;
if(q===c)return 1;
if(q.includes(c)||c.includes(q)){
return 0.78+0.2*(Math.min(q.length,c.length)/Math.max(q.length,c.length));
}
const a=getSearchTerms(q);
const b=getSearchTerms(c);
let common=0;
for(const term of a)if(b.has(term))common++;
if(!common)return 0;
const precision=common/b.size;
const recall=common/a.size;
return(2*precision*recall)/(precision+recall);
}

function thinkAiResponse(message){
const ranked=appState.qaList.map(item=>{
const questionScore=similarityScore(message,item.question);
const answerScore=similarityScore(message,item.answer)*0.25;
return{item,score:Math.max(questionScore,answerScore)};
}).sort((a,b)=>b.score-a.score);
const best=ranked[0];
const second=ranked[1];
if(best&&best.score>=0.24&&(!second||best.score-second.score>=0.025||best.score>=0.72)){
return{answer:best.item.answer,isUnknown:false,matchedQuestion:best.item.question,confidence:best.score};
}
return{answer:appState.config.fallback,isUnknown:true,confidence:best?best.score:0};
}

function teachFromMessage(index){
const session=getCurrentSession();
const message=session&&session.messages[index];
if(message&&message.unknownQ)teachDirectly(message.unknownQ);
}

function teachDirectly(question){
const answer=prompt(`「${question}」に対するAIの正しい答えを入力してね：`);
if(answer===null||!answer.trim())return;
appState.qaList.unshift({id:"q_"+Date.now(),question,answer:answer.trim()});
saveLocalState();
renderQaList();
alert("新しい知識を習得したよ！もう一度質問してみてね。");
}

function applyProfileSettings(){
appState.config.name=document.getElementById("ai-name").value.trim()||"AIアシスタント";
appState.config.avatar=document.getElementById("ai-avatar").value.trim()||"🔷";
appState.config.fallback=document.getElementById("ai-fallback").value.trim()||"その知識データはありません。学習させてください。";
saveLocalState();
renderAll();
alert("設定を保存したよ！");
}

function addQaItem(){
const question=document.getElementById("qa-question").value.trim();
const answer=document.getElementById("qa-answer").value.trim();
if(!question||!answer){alert("質問と答えの両方を入力してね！");return;}
appState.qaList.unshift({id:"q_"+Date.now(),question,answer});
saveLocalState();
renderQaList();
document.getElementById("qa-question").value="";
document.getElementById("qa-answer").value="";
alert("新しい知識をメモリに書き込んだよ！");
}

function deleteQa(id){
appState.qaList=appState.qaList.filter(item=>item.id!==id);
saveLocalState();
renderQaList();
}

function openExportModal(){document.getElementById("export-modal").classList.remove("hidden");}
function closeExportModal(){document.getElementById("export-modal").classList.add("hidden");}

function exportJsonFile(){
const filename=(document.getElementById("export-filename").value.trim()||"my_ai_data")+".json";
const blob=new Blob([JSON.stringify(appState,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");
link.href=url;
link.download=filename;
link.click();
URL.revokeObjectURL(url);
}

function importJsonFile(event){
const file=event.target.files&&event.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(e){
try{
const parsed=JSON.parse(e.target.result);
if(!parsed||!parsed.config||!Array.isArray(parsed.qaList))throw new Error("形式が違います");
appState={
config:{...appState.config,...parsed.config},
qaList:parsed.qaList,
sessions:Array.isArray(parsed.sessions)?parsed.sessions:[]
};
if(!appState.qaList.length)appState.qaList=DEFAULT_QA.map(item=>({...item}));
if(!appState.sessions.length)createSession();
else currentSessionId=appState.sessions[0].id;
saveLocalState();
renderAll();
closeExportModal();
alert("学習データを読み込んだよ！");
}catch(error){alert("読み込みエラー：正しい学習データJSONを選んでね。");}
event.target.value="";
};
reader.readAsText(file,"UTF-8");
}

function escapeHtml(value){
return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
</script>
</body>
</html>
